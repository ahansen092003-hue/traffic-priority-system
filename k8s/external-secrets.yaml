# ExternalSecret syncs 'anthropic-api-key' from GCP Secret Manager into a
# native Kubernetes Secret named 'claude-secret'. The claude-controller pod
# reads it via secretKeyRef — no app code changes needed.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: claude-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: claude-secret
    creationPolicy: Owner
  data:
  - secretKey: ANTHROPIC_API_KEY
    remoteRef:
      key: anthropic-api-key
---
# ExternalSecret syncs 'postgres-password' from GCP Secret Manager into a
# native Kubernetes Secret named 'postgres-secret'. The postgres pod reads
# it via secretKeyRef.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: postgres-secret
    creationPolicy: Owner
  data:
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: postgres-password
