# Kubernetes ServiceAccount that pods use to authenticate to Google APIs.
# The annotation binds it to the GSA created in terraform/secrets.tf via
# Workload Identity — pods using this KSA can call Secret Manager without
# any key files or hardcoded credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-accessor
  annotations:
    iam.gke.io/gcp-service-account: traffic-secrets-accessor@traffic-priority-ahan.iam.gserviceaccount.com
