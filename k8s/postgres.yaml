apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  001_initial.sql: |
    CREATE TABLE routes (
        route_id    SERIAL PRIMARY KEY,
        name        TEXT NOT NULL,
        description TEXT
    );

    CREATE TABLE stops (
        stop_id          SERIAL PRIMARY KEY,
        route_id         INT REFERENCES routes(route_id),
        intersection_id  TEXT NOT NULL,
        sequence_order   INT NOT NULL,
        UNIQUE (route_id, sequence_order)
    );

    CREATE TABLE schedules (
        schedule_id       SERIAL PRIMARY KEY,
        route_id          INT REFERENCES routes(route_id),
        departure_time    TIME NOT NULL,
        frequency_minutes INT NOT NULL
    );

    CREATE TABLE bus_runs (
        run_id         SERIAL PRIMARY KEY,
        route_id       INT REFERENCES routes(route_id),
        vehicle_id     TEXT NOT NULL,
        started_at     TIMESTAMPTZ NOT NULL DEFAULT now(),
        current_stop   INT REFERENCES stops(stop_id),
        delay_seconds  INT NOT NULL DEFAULT 0
    );
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      serviceAccountName: secret-accessor
      containers:
      - name: postgres
        image: postgres:16
        env:
        - name: POSTGRES_DB
          value: "bus_routes"
        - name: POSTGRES_USER
          value: "traffic"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init-sql
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: init-sql
        configMap:
          name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
